<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL TOSS EXPERT™ | Official Prediction Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-cyan: #38bdf8;
            --glass-bg: rgba(11, 15, 25, 0.78);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            /* Colorful Mesh Gradient Background */
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.65) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(245, 158, 11, 0.55) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.65) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(14, 165, 233, 0.65) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.35) 0px, transparent 50%);
            background-size: 160% 160%;
            animation: vibrantMesh 10s ease infinite alternate;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 15px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes vibrantMesh {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 100%; }
        }

        /* Floating Light Spheres for Extra Depth */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
            animation: orbFloat 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 250px;
            height: 250px;
            background: #a855f7;
            top: 5%;
            left: 10%;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: #10b981;
            bottom: 5%;
            right: 10%;
            animation-delay: -3s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        /* Subtle Grid Pattern Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 2;
            pointer-events: none;
        }

        /* Glassmorphism Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 32px 24px 28px;
            text-align: center;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.6),
                0 0 45px rgba(168, 85, 247, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* Live Status Pill */
        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #34d399;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 22px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Avatar Container with Multi-layer Glow */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
        }

        .avatar-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #38bdf8, #10b981, #fbbf24);
            animation: spinRing 5s linear infinite;
            filter: blur(3px);
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0f172a;
            background-color: #1e293b;
        }

        /* Branding Headers */
        .title {
            font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .verified-badge {
            color: #38bdf8;
            font-size: 20px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 22px;
        }

        /* Highlights Card */
        .highlights-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 21px;
            font-weight: 900;
            color: var(--accent-gold);
            line-height: 1.1;
        }

        .stat-val.green {
            color: var(--accent-green);
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Feature Bullet Points */
        .feature-box {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            text-align: left;
        }

        .feature-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #f1f5f9;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .feature-row:last-child {
            margin-bottom: 0;
        }

        .icon-wrap {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-size: 14px;
            flex-shrink: 0;
        }

        /* High-Converting Glowing CTA Button */
        .btn-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .cta-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 100px;
            box-shadow: 
                0 14px 30px rgba(16, 185, 129, 0.5),
                0 0 25px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
            transform: rotate(45deg);
            animation: shine 2.8s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
